<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>바닷가 별장 테스트</title><link rel="stylesheet" href="seaside-villa.css?v=197"><style>@font-face{font-family:'User Paperlogy Bold';src:url('assets/user-fonts-paperlogy/Paperlogy-7Bold.ttf');font-weight:700}@font-face{font-family:'User Paperlogy ExtraBold';src:url('assets/user-fonts-paperlogy/Paperlogy-8ExtraBold.ttf');font-weight:800}body{margin:0;background:#20a8d5;color:white;font:700 18px 'User Paperlogy Bold',sans-serif;text-align:center}main{max-width:480px;margin:20dvh auto;padding:24px}button#preview-start{background:linear-gradient(#83ed23,#1c9e16);border:3px solid #ffdf59;border-radius:30px;color:#fff;padding:16px 30px;font:inherit;cursor:pointer}p{line-height:1.7;font-size:16px}a{color:#fff4a3}</style><main><h1>나의 바닷가 별장</h1><p>공터부터 10단계까지 지어볼 수 있어요.<br>테스트 코인으로 체험하며<br>본 게임의 코인과 진행 기록은 바뀌지 않아요.</p><button id="preview-start">별장 테스트 시작</button><p><a href="./?v=197">본 게임으로 돌아가기</a></p></main><script type="module">
import {Progress} from './progress.js';import {installSeasideVilla} from './seaside-villa.js?v=197';import {sound} from './audio.js';
const data=new Map(),storage={getItem:key=>data.get(key)??null,setItem:(key,value)=>data.set(key,value)},progress=new Progress(storage);const initial=progress.read();initial.home=10;initial.coins=12000;progress.write(initial);const ui=installSeasideVilla({progress,onEnter:()=>document.querySelector('main').hidden=true,onForest:()=>document.querySelector('main').hidden=false,onGame:()=>location.href='./?v=197'});document.querySelector('#preview-start').onclick=()=>{sound.unlock();ui.open();};
</script></html>
