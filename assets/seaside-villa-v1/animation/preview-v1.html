<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바닷가 별장 · 물결과 갈매기</title><style>body{margin:0;background:#15374c;color:#fff;font:16px sans-serif;text-align:center}h1{font-size:22px}canvas{width:min(92vw,480px);height:auto;border-radius:18px}button,a{display:inline-block;margin:12px;padding:12px 18px;border-radius:18px;background:#e9faff;color:#154264;border:0;font:inherit}.note{padding:0 14px}</style><h1>잔잔한 물 일렁임 · 갈매기 비행</h1><p class="note">별장 배경에 겹친 움직임 확인용입니다. 게임에는 아직 적용하지 않았습니다.</p><canvas width="512" height="768" aria-label="잔잔한 해변과 날아가는 갈매기"></canvas><div><button id="pause">일시정지</button><a href="seagull-atlas.png">갈매기 투명 시트</a><a href="water-atlas.png">물결 투명 시트</a></div><script type="module">
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');async function load(src){let im=new Image;im.src=src;await im.decode();return im}const[bg,bird,water]=await Promise.all([load('../seaside-background-calm.webp'),load('seagull-atlas.webp'),load('water-atlas.webp')]);let t=0,last=0,paused=false;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'다시 재생':'일시정지'};function sprite(im,n,fw,fh,x,y,w,h,alpha=1){ctx.globalAlpha=alpha;ctx.drawImage(im,n%4*fw,Math.floor(n/4)*fh,fw,fh,x,y,w,h);ctx.globalAlpha=1}function render(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!paused)t+=dt;ctx.drawImage(bg,0,0,512,768);ctx.save();ctx.beginPath();ctx.moveTo(0,215);ctx.lineTo(512,215);ctx.lineTo(512,292);ctx.lineTo(0,350);ctx.closePath();ctx.clip();for(let i=0;i<5;i++){let f=t*3+i*1.37,n=Math.floor(f)%8,m=f%1;let y=229+i*18+Math.sin(t*.7+i)*1.2,x=-90+(i%2)*95;let w=530-i*37,h=72; sprite(water,n,512,192,x,y,w,h,.23*(1-m));sprite(water,(n+1)%8,512,192,x,y,w,h,.23*m);}ctx.restore();for(let i=0;i<2;i++){let local=(t+[2,12][i])%(35+i*12),duration=27+i*5;if(local>duration)continue;let u=local/duration,w=52-i*12,x=i?550-u*650:-90+u*650,y=120+i*38+Math.sin(u*3.14)*(-12+i*4)+Math.sin(t*.6+i)*2;let flap=Math.sin(t*.4+i)>0?2:Math.floor(t*(8+i)+i*3)%8;ctx.save();ctx.translate(x+w/2,y+w/2);ctx.scale(i?-1:1,1);sprite(bird,flap,512,512,-w/2,-w/2,w,w);ctx.restore();}canvas.dataset.frame=String(Math.floor(t*9));requestAnimationFrame(render)}requestAnimationFrame(render);
</script></html>
