<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바닷가 별장 · 물결과 갈매기</title><style>body{margin:0;background:#15374c;color:#fff;font:16px sans-serif;text-align:center}h1{font-size:22px}canvas{width:min(92vw,480px);height:auto;border-radius:18px}button,a{display:inline-block;margin:12px;padding:12px 18px;border-radius:18px;background:#e9faff;color:#154264;border:0;font:inherit}.note{padding:0 14px}</style><h1>바다 일렁임 · 햇빛 반짝임 · 밀려오는 파도</h1><p class="note">바다의 일렁임과 햇빛 반짝임을 더했습니다. 갈매기는 야자수 뒤로 가려집니다.</p><canvas width="512" height="768" aria-label="잔잔한 해변과 날아가는 갈매기"></canvas><div><button id="pause">일시정지</button><a href="seagull-atlas.png">갈매기 투명 시트</a><a href="water-atlas.png">물결 투명 시트</a><a href="../shore-layers-v2/sunlight-atlas.png">햇빛 반짝임 8단계</a><a href="../shore-layers-v2/swash-atlas.png">밀려오는 파도 8단계</a><a href="../shore-layers-v2/palm-foreground.png">투명 야자수</a><a href="../shore-layers-v2/beach-base.png">기본 배경</a></div><script type="module">
import {paintSeaMotion} from "./sea-effects-v3.js";
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');async function load(src){let im=new Image;im.src=src;await im.decode();return im}const[bg,bird,water,palm,swash,sun]=await Promise.all([load('../shore-layers-v2/beach-base.webp'),load('seagull-atlas.webp'),load('water-atlas.webp'),load('../shore-layers-v2/palm-foreground.webp'),load('../shore-layers-v2/swash-atlas.webp'),load('../shore-layers-v2/sunlight-atlas.webp')]);let t=0,last=0,paused=false;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'다시 재생':'일시정지'};function sprite(im,n,fw,fh,x,y,w,h,alpha=1){ctx.globalAlpha=alpha;ctx.drawImage(im,n%4*fw,Math.floor(n/4)*fh,fw,fh,x,y,w,h);ctx.globalAlpha=1}function render(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!paused)t+=dt;ctx.drawImage(bg,0,0,512,768);canvas.dataset.sunlightCount=String(paintSeaMotion(ctx,bg,water,sun,t));const phase=(t%8)/8,spread=Math.sin(phase*Math.PI),f=phase*8,n=Math.floor(f)%8,m=f%1;ctx.save();ctx.transform(1,-.13,0,1,0,356);const sy=-34+spread*17,sh=42+spread*15,sa=Math.pow(spread,.55)*.78;sprite(swash,n,768,256,-90,sy,700,sh,sa*(1-m));sprite(swash,(n+1)%8,768,256,-90,sy,700,sh,sa*m);ctx.restore();for(let i=0;i<2;i++){let local=(t+[2,12][i])%(35+i*12),duration=27+i*5;if(local>duration)continue;let u=local/duration,w=52-i*12,x=i?550-u*650:-90+u*650,y=120+i*38+Math.sin(u*3.14)*(-12+i*4)+Math.sin(t*.6+i)*2;let flap=Math.sin(t*.4+i)>0?2:Math.floor(t*(8+i)+i*3)%8;ctx.save();ctx.translate(x+w/2,y+w/2);ctx.scale(i?-1:1,1);sprite(bird,flap,512,512,-w/2,-w/2,w,w);ctx.restore();}ctx.drawImage(palm,0,0,512,768);canvas.dataset.layerOrder='base,animated-water,ripples,sunlight,swash,seagulls,palm';canvas.dataset.frame=String(Math.floor(t*9));requestAnimationFrame(render)}requestAnimationFrame(render);
</script></html>
