<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주인공과 강아지 에셋</title><style>body{background:#e3eef1;color:#183746;font-family:sans-serif;margin:0;padding:24px}h1{text-align:center;font-size:25px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}article{background:white;border-radius:20px;padding:18px;text-align:center}.stage{height:280px;background:linear-gradient(#a9dce9 65%,#add58b 65%);border-radius:14px;display:grid;align-items:end;justify-items:center;overflow:hidden}.sprite{background-repeat:no-repeat;filter:drop-shadow(0 3px 2px #173d4950)}.sheet{width:100%;margin-top:15px;background-color:#f2f2f2;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}a{color:#0877a1}</style><h1>주인공과 강아지 · 투명 동작 에셋</h1><main><article><h2>주인공 · 인사</h2><div class="stage"><div class="sprite" data-name="hero-wave" style="width:150px;height:225px;background-image:url(hero-wave.webp);background-size:400% 200%"></div></div><p>8프레임 · 투명 배경 · 발 위치 정렬</p><a href="hero-wave.png">PNG 시트</a> · <a href="hero-wave.webp">게임용 WebP</a><img class="sheet" src="hero-wave.png" alt="주인공 · 인사 전체 프레임"></article><article><h2>강아지 · 꼬리 흔들기</h2><div class="stage"><div class="sprite" data-name="dog-tail" style="width:150px;height:150px;background-image:url(dog-tail.webp);background-size:400% 200%"></div></div><p>8프레임 · 투명 배경 · 발 위치 정렬</p><a href="dog-tail.png">PNG 시트</a> · <a href="dog-tail.webp">게임용 WebP</a><img class="sheet" src="dog-tail.png" alt="강아지 · 꼬리 흔들기 전체 프레임"></article><article><h2>강아지 · 걷기</h2><div class="stage"><div class="sprite" data-name="dog-walk" style="width:150px;height:150px;background-image:url(dog-walk.webp);background-size:400% 200%"></div></div><p>8프레임 · 투명 배경 · 발 위치 정렬</p><a href="dog-walk.png">PNG 시트</a> · <a href="dog-walk.webp">게임용 WebP</a><img class="sheet" src="dog-walk.png" alt="강아지 · 걷기 전체 프레임"></article></main><script>setInterval(()=>{const n=Math.floor(Date.now()/140)%8;document.querySelectorAll('.sprite').forEach(el=>el.style.backgroundPosition=(n%4*100/3)+'% '+(Math.floor(n/4)*100)+'%')},70)</script></html>
