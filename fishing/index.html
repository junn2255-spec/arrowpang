<!doctype html><html data-test-theme="fishing" lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143c43"><title>화살표팡 · 낚시 미니게임</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mini-game.css"></head><body><main id="game" aria-label="자연인 타이쿤 저수지 릴낚싯대 낚시"><canvas id="canvas" width="540" height="960" aria-label="잔잔한 바다와 릴낚싯대, 고정 길이 낚싯줄과 찌"></canvas><header class="wood-sign"><strong>자연인 타이쿤</strong><h1>바닷가 낚시터</h1></header><section class="weather" aria-label="게임 속 날짜와 날씨"><span class="sun">☀</span><div><b hidden>10월 12일 (월)</b><span id="clock">오전 10:24 맑음</span></div><button id="sound" aria-label="소리 켜기" aria-pressed="false">♪<small>OFF</small></button></section><nav class="left-tools" aria-label="낚시 준비"><button id="bag"><span class="tool-icon" data-icon="bag"></span><b>어망</b><small id="bagCount">어망 0</small></button><button id="bait"><span class="tool-icon" data-icon="bait"></span><b>미끼</b><small id="baitName">크릴새우</small></button><button id="equipment"><span class="tool-icon" data-icon="rig"></span><b>채비</b></button><button id="underwater" aria-label="수중 보기" aria-haspopup="dialog" aria-expanded="false"><span class="underwater-button-art" aria-hidden="true"></span><b>수중 보기</b></button></nav><div id="methodArrow" aria-hidden="true" hidden></div><aside id="startInvitation" role="status" hidden><p>낚시터에서 물고기의 짜릿한 손맛을 느껴보세요.</p><p>먼저 낚시안내 버튼을 눌러 낚시방법을 확인하세요.</p></aside><div id="aimLabel">수면을 좌우로 밀어 방향 조절</div><section id="chargePanel" hidden aria-live="polite"><div><b id="chargeTitle">대를 뒤로 젖히는 중</b><strong id="chargeNumber">0%</strong></div><div class="charge-track"><i id="chargeFill"></i><span class="sweet-zone"></span><em id="chargeNeedle"></em></div><small class="success-label">성공 구간</small></section><section id="fightHud" hidden><small id="fightPreviewLabel" hidden></small><div class="meter-label"><span>줄 조절</span><b id="tensionNumber">
