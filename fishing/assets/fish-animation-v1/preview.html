<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>물고기 8종 움직임 에셋</title><style>body{background:#082b44;color:white;font-family:sans-serif;margin:24px}h1{text-align:center}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:1200px;margin:auto}article{border:1px solid #4099b7;border-radius:18px;text-align:center;background:#145574}img{width:100%;display:block}a{color:#bcf5ff}button{display:block;margin:20px auto;padding:12px 25px;font-size:18px}</style><h1>물고기 8종 · 8프레임 미리보기</h1><button id="toggle">일시정지</button><main><article><h2>망둥어</h2><img data-id="goby" src="goby/frame-01.png" alt="망둥어"><p><a href="goby/sheet.png">8프레임 시트 PNG</a></p></article><article><h2>노래미</h2><img data-id="greenling" src="greenling/frame-01.png" alt="노래미"><p><a href="greenling/sheet.png">8프레임 시트 PNG</a></p></article><article><h2>볼락</h2><img data-id="rockfish" src="rockfish/frame-01.png" alt="볼락"><p><a href="rockfish/sheet.png">8프레임 시트 PNG</a></p></article><article><h2>감성돔</h2><img data-id="black-seabream" src="black-seabream/frame-01.png" alt="감성돔"><p><a href="black-seabream/sheet.png">8프레임 시트 PNG</a></p></article><article><h2>돌돔</h2><img data-id="striped-beakfish" src="striped-beakfish/frame-01.png" alt="돌돔"><p><a href="striped-beakfish/sheet.png">8프레임 시트 PNG</a></p></article><article><h2>농어</h2><img data-id="sea-bass" src="sea-bass/frame-01.png" alt="농어"><p><a href="sea-bass/sheet.png">8프레임 시트 PNG</a></p></article><article><h2>참돔</h2><img data-id="red-seabream" src="red-seabream/frame-01.png" alt="참돔"><p><a href="red-seabream/sheet.png">8프레임 시트 PNG</a></p></article><article><h2>능성어</h2><img data-id="grouper" src="grouper/frame-01.png" alt="능성어"><p><a href="grouper/sheet.png">8프레임 시트 PNG</a></p></article></main><script>let frame=0,playing=true;document.querySelector('#toggle').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시정지':'재생'};setInterval(()=>{if(!playing)return;frame=(frame+1)%8;document.querySelectorAll('img[data-id]').forEach(i=>i.src=i.dataset.id+'/frame-'+String(frame+1).padStart(2,'0')+'.png')},125)</script></html>
