<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바닷가 배경 · 갈매기</title><style>body{margin:0;background:#122635;color:white;font:16px sans-serif;text-align:center}h1{font-size:18px}p{font-size:13px;color:#c6d6df}.scene{position:relative;width:min(100vw,432px);aspect-ratio:9/16;margin:auto;overflow:hidden;background:url(seaside-background-1080x1920.webp) center/cover}.gull{position:absolute;width:64px;height:64px;left:-70px;top:14%;animation:fly 22s linear infinite}.gull:nth-child(2){top:20%;animation-delay:-9s;width:48px;height:48px}.gull:nth-child(3){top:10%;animation-delay:-17s;width:40px;height:40px}@keyframes fly{to{left:110%}}@media(prefers-reduced-motion:reduce){.gull{animation:none;left:25%}.gull:nth-child(2){left:50%}.gull:nth-child(3){left:70%}}</style><h1>바닷가 배경 + 갈매기</h1><p>배경·갈매기만 미리보기</p><div class="scene"><img class="gull" src="seagull-flight-01.webp"><img class="gull" src="seagull-flight-02.webp"><img class="gull" src="seagull-flight-03.webp"></div><script>const sequence=[1,2,3,5,3,2],birds=[...document.querySelectorAll('.gull')];let f=0;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{birds.forEach((b,i)=>b.src='seagull-flight-'+String(sequence[(f+i*2)%sequence.length]).padStart(2,'0')+'.webp');f++},1000/7);</script></html>
