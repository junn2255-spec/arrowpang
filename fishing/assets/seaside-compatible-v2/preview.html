<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기존 게임 규격 비교</title><style>body{margin:0;background:#172f3c;color:white;text-align:center;font:15px sans-serif}h1{font-size:22px}canvas{width:min(100%,900px);background:#496c78}p{color:#c3d7de}</style><h1>기존 게임 규격으로 제작한 찌와 감성돔</h1><p>왼쪽 기존 붕어·찌 / 오른쪽 감성돔·바다 막대찌</p><canvas width="900" height="580"></canvas><p>실제 게임의 6자세 재생·몸 휘어짐·찌 표시 함수를 사용한 비교</p><script type="module">import{paintAtlasFloat,paintCrucianAtlas}from'./renderer-preview.js';const load=src=>new Promise((resolve,reject)=>{let im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=src});const images=await Promise.all(['../../assets/large-crucian-carp-atlas.webp','black-sea-bream-atlas.webp','../../assets/fishing-ui-atlas.webp','fishing-ui-atlas-sea.webp'].map(load));const c=document.querySelector('canvas').getContext('2d');window.previewReady=true;function frame(t){c.clearRect(0,0,900,580);for(let i=0;i<2;i++){c.save();c.translate(390+i*450,210);paintCrucianAtlas(c,images[i],{},320,t/1000*8,false);c.restore();c.save();c.translate(225+i*450,460);c.scale(2,2);paintAtlasFloat(c,images[2+i]);c.restore();c.fillStyle='#d9eff5';c.font='16px sans-serif';c.textAlign='center';c.fillText(i?'감성돔 · 바다 막대찌':'기존 붕어 · 찌',225+i*450,540)}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
