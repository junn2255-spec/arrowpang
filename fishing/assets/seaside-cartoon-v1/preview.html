<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>갯바위 낚시 · 만화풍 에셋</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#102b35;color:#f4f6e7;font:15px/1.5 sans-serif}h1{font-size:24px}p{color:#b4d9db}main{display:grid;grid-template-columns:360px 1fr;gap:28px;max-width:1400px;margin:auto}.scene{width:360px;height:640px;position:relative;overflow:hidden;border:2px solid #e7c76c;border-radius:22px;background:#4ecfe4}.bg{width:100%;height:100%;object-fit:cover}.rock{position:absolute;left:0;bottom:0;width:100%}.rod{position:absolute;right:0;bottom:4%;height:84%;width:auto}.reel{position:absolute;right:1%;bottom:13%;width:32%}.fish{position:absolute;top:47%;left:21%;width:32%}.splash{position:absolute;top:64%;left:17%;width:40%;opacity:.8}.hud{position:absolute;left:4%;right:4%;top:3%;padding:12px;background:#124d58ef;border:2px solid #f2d67d;border-radius:17px;font-weight:bold}.button{position:absolute;bottom:3%;right:4%;width:25%}.button img{width:100%}.button span{position:absolute;bottom:11%;left:15%;right:15%;text-align:center;font-size:14px;font-weight:700;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:12px}.item{margin:0;background:#193d49;border-radius:12px;overflow:hidden}.checker{height:150px;padding:8px;background-color:#8b9ca2;background-image:linear-gradient(45deg,#a5b4b8 25%,transparent 25%),linear-gradient(-45deg,#a5b4b8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#a5b4b8 75%),linear-gradient(-45deg,transparent 75%,#a5b4b8 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.checker img{width:100%;height:100%;object-fit:contain}figcaption{padding:8px;font-size:11px;overflow-wrap:anywhere}#animations{grid-template-columns:repeat(2,minmax(0,1fr))}.label{color:#fff3b1;margin-top:12px}section>h2{font-size:18px}@media(max-width:800px){main{grid-template-columns:1fr}.scene{max-width:100%}.grid{grid-template-columns:repeat(2,minmax(100px,1fr))}}@media(prefers-reduced-motion:reduce){.scene{scroll-behavior:auto}}
</style><main><section><h1>갯바위 낚시 에셋</h1><p>만화풍 · 투명 PNG / WebP<br>에셋 합성 미리보기 — 게임 적용 전</p><div class="scene"><img class="bg" src="background-coast-day.webp"><img class="rock" src="foreground-rocks.webp"><img class="rod" src="equipment/rod-bend-heavy.webp"><img class="reel" src="equipment/reel-complete.webp"><img class="splash" data-anim="fish-splash"><img class="fish" data-anim="catch"><div class="hud">갯바위 낚시　　1 / 3마리</div><div class="button"><img src="ui/button-reel.webp"><span>릴 감기</span></div></div><p class="label">버튼 글자는 이미지에 굽지 않고 게임에서 표시합니다.</p><h2>동작 미리보기</h2><div class="grid" id="animations"></div></section><section><h2>개별 에셋</h2><div class="grid" id="assets"></div></section></main><script>
fetch('manifest.json').then(r=>r.json()).then(m=>{for(const [name,a]of Object.entries(m.assets)){const f=document.createElement('figure');f.className='item';f.innerHTML=`<div class="checker"><img src="${a.webp}" loading="lazy"></div><figcaption>${name}<br>${a.width} × ${a.height}</figcaption>`;document.querySelector('#assets').append(f)}for(const [name,a]of Object.entries(m.animations)){const f=document.createElement('figure');f.className='item';f.innerHTML=`<div class="checker"><img data-anim="${name}"></div><figcaption>${name} · ${a.frames.length}프레임</figcaption>`;document.querySelector('#animations').append(f)}const imgs=[...document.querySelectorAll('[data-anim]')];let stamp=0;setInterval(()=>{stamp+=125;for(const img of imgs){const a=m.animations[img.dataset.anim];const i=matchMedia('(prefers-reduced-motion: reduce)').matches?0:Math.floor(stamp*a.fps/1000)%a.frames.length;img.src=a.frames[i].replace('.png','.webp')}},125)});
</script></html>
